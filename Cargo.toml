[package]
name = "teapot"
version = "0.2.0"
authors = ["takakawa <takakawa@163.com>", "Matthias Endler <matthias@endler.dev>"]
edition = "2024"
rust-version = "1.88"
description = "A simple configurable dummy server for testing HTTP clients"
repository = "https://github.com/mre/teapot"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false }
# Keep route validation aligned with Axum's router.
matchit = "=0.8.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
